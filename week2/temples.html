<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temple Album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/temples.css" />
  <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 768px)" />
  <script src="scripts/temples.js" defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <p class="site-title">Temple Album</p>
      <button id="hamburger" aria-label="Toggle navigation menu" aria-expanded="false">
        <span class="hamburger-icon">&#9776;</span>
      </button>
      <nav id="main-nav">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Old</a></li>
          <li><a href="#">New</a></li>
          <li><a href="#">Large</a></li>
          <li><a href="#">Small</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Temples</h1>
    <div class="gallery">

      <figure>
        <img src="images/salt_lake_temple.jpeg" alt="Salt Lake Temple" loading="lazy" />
        <figcaption>Salt Lake Temple</figcaption>
      </figure>

      <figure>
        <img src="images/provo_city_center_temple.jpeg" alt="Provo City Center Temple" loading="lazy" />
        <figcaption>Provo City Center Temple</figcaption>
      </figure>

      <figure>
        <img src="images/logan_temple.jpeg" alt="Logan Utah Temple" loading="lazy" />
        <figcaption>Logan Utah Temple</figcaption>
      </figure>

      <figure>
        <img src="images/manti_temple_lds.jpeg" alt="Manti Utah Temple" loading="lazy" />
        <figcaption>Manti Utah Temple</figcaption>
      </figure>

      <figure>
        <img src="images/boise_idaho_temple.jpeg" alt="Boise Idaho Temple" loading="lazy" />
        <figcaption>Boise Idaho Temple</figcaption>
      </figure>

      <figure>
        <img src="images/st_george_temple.jpeg" alt="St. George Utah Temple" loading="lazy" />
        <figcaption>St. George Utah Temple</figcaption>
      </figure>

      <figure>
        <img src="images/washington_dc.jpeg" alt="Washington D.C. Temple" loading="lazy" />
        <figcaption>Washington D.C. Temple</figcaption>
      </figure>

      <figure>
        <img src="images/mexico_city.jpeg" alt="Mexico City Mexico Temple" loading="lazy" />
        <figcaption>Mexico City Mexico Temple</figcaption>
      </figure>

      <figure>
        <img src="images/nauvoo_Illinois.jpeg" alt="Nauvoo Illinois Temple" loading="lazy" />
        <figcaption>Nauvoo Illinois Temple</figcaption>
      </figure>

    </div>
  </main>

  <footer>
    <p>&copy; <span id="copyright-year"></span> Temple Album</p>
    <p>Last Modified: <span id="last-modified"></span></p>
  </footer>
</body>
</html>
